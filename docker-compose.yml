services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carevision
      POSTGRES_USER: carevision
      # SECURITY: Use environment variable for password with secure default for development only
      # In production, always set POSTGRES_PASSWORD via .env file or secrets manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carevision_dev_secure_random_${RANDOM}}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carevision"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # SECURITY: Use environment variables for sensitive data
      # Database credentials should come from secrets in production
      DATABASE_URL: postgresql+asyncpg://carevision:${POSTGRES_PASSWORD:-carevision_dev}@db:5432/carevision
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # SECURITY: CORS origins must be explicitly set in production (HTTPS only)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-'["http://localhost:5173"]'}
      # Security configuration
      DEVICE_AUTH_SECRET_KEY: ${DEVICE_AUTH_SECRET_KEY:-dev_secret_change_in_production}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-10/minute}
      RATE_LIMIT_ANALYZE: ${RATE_LIMIT_ANALYZE:-5/minute}
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

volumes:
  postgres_data:
